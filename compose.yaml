services:
  oapi:
    container_name: api-oapi
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      OAPI_ENV: production
      RUST_LOG: info
    ports:
      - "9003:9003"
    volumes:
      - generated_images:/app/generated_images
      - ./deploy/config.production.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  generated_images:
