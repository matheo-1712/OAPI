services:
  oapi:
    container_name: api-oapi
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      OAPI_ENV: production
      RUST_LOG: info
      PB_URL: http://pocketbase:8090
    networks:
      - pocketbase
    ports:
      - "9003:9003"
    volumes:
      - generated_images:/app/generated_images
      - adln_links:/app/data/adln_links
      - ./deploy/config.production.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  generated_images:
  adln_links:

networks:
  pocketbase:
    external: true
    name: ${POCKETBASE_NETWORK:-pocketbase_network}
