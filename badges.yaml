# Remplir chaque id avec l'identifiant du badge dans PocketBase.
# Les entrées avec un id vide ne sont pas attribuées.
# Tous les paliers atteints sont attribués et conservés.
badges:
  - id: "0kh4pd8nd68kb36" # Message I
    kind: discord_user
    rule: { stat: message_count, minimum: 100 }
  - id: "0y2043c5dt1gk76" # Message II
    kind: discord_user
    rule: { stat: message_count, minimum: 1000 }
  - id: "v8jobh954c6w6s5" # Message III
    kind: discord_user
    rule: { stat: message_count, minimum: 3000 }
  - id: "y9re3r8l8fr2418" # Message IV
    kind: discord_user
    rule: { stat: message_count, minimum: 8000 }
  - id: "39eku1w1yoftjj5" # Message V
    kind: discord_user
    rule: { stat: message_count, minimum: 15000 }

  # vocal_time : heures décimales, comme dans les graphiques.
  - id: "2569j9155j9z7b4" # Vocal I
    kind: discord_user
    rule: { stat: voice_joined, minimum: 1 }
  - id: "6214hc5cku07ycf" # Vocal II
    kind: discord_user
    rule: { stat: vocal_time, minimum: 100 }
  - id: "oq8v4981fxh5gc4" # Vocal III
    kind: discord_user
    rule: { stat: vocal_time, minimum: 500 }
  - id: "37xga45149irr16" # Vocal IV
    kind: discord_user
    rule: { stat: vocal_time, minimum: 1000 }
  - id: "2vn37mtk98148d3" # Vocal V
    kind: discord_user
    rule: { stat: vocal_time, minimum: 2000 }
  - id: "" # Bienvenue dans l'Antre
    kind: discord_user
    rule: { stat: membership, minimum: 1 }

  # playtime : ticks Minecraft, 20 ticks/s = 72000 ticks/h.
  - id: "hnjs75ds906pzwd" # Première fois à l'eau
    kind: player
    rule: { stat: playtime, minimum: 72000 } # 1 h
  - id: "ak5lc4958h8471d" # Petit pas pour l'Homme, grand pour la Loutre
    kind: player
    rule: { stat: playtime, minimum: 3600000 } # 50 h
  - id: "01t202at920km67" # La Loutre qui ne touche pas d'herbe
    kind: player
    rule: { stat: playtime, minimum: 36000000 } # 500 h
  - id: "ujc6wd59fe19651" # La Loutre qui ne touche pas d'eau non plus
    kind: player
    rule: { stat: playtime, minimum: 72000000 } # 1000 h
  - id: "h6u6351o72bw936" # Migatte no Loutrui
    kind: player
    rule: { stat: playtime, minimum: 144000000 } # 2000 h

  # Manuel en attendant l'identifiant exact du serveur Vanilla.
  - id: "8730w898fzs2gja" # Aventure sans fin
    kind: player

# « Une loutre qui ne prend pas de douche » est volontairement exclu.
